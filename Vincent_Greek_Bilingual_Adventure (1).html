<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vincent's Greek Adventure</title><style>:root{font-family:system-ui,Arial;background:#f4f8ff;color:#24304b}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(120deg,#6646cf,#26a7c9);color:white;border-radius:24px;padding:22px}h1{margin:0 0 8px;font-size:1.7rem}h2{margin:0 0 8px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button,.btn{border:0;border-radius:12px;padding:12px 14px;background:white;box-shadow:0 2px 8px #2232;cursor:pointer;font-weight:700}.nav button.active{background:#4f46e5;color:white}.panel{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 20px #2231;min-height:360px}.en{font-size:1rem;color:#586781}.gr{font-size:1.45rem;font-weight:750;margin:18px 0}.options{display:grid;gap:10px;margin:20px 0}.choice{border:2px solid #dce4f2;background:#f8faff;padding:15px;border-radius:14px;text-align:left;font-size:1.2rem;cursor:pointer}.choice:hover{border-color:#7561ef}.choice.correct{background:#e1f9e9;border-color:#22a35d}.choice.wrong{background:#fff0ed;border-color:#e76666}.feedback{min-height:52px;font-weight:700}.next{background:#4f46e5;color:white}.small{font-size:.9rem;color:#64748b}.prompt{background:#f3edff;padding:12px;border-radius:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{padding:8px 12px;border:1px solid #ddd;border-radius:9px;cursor:pointer;background:#fff}.color{width:38px;height:38px;border:3px solid white;box-shadow:0 0 0 1px #aab;border-radius:50%;cursor:pointer}.color.selected{box-shadow:0 0 0 3px #343a8f}canvas{display:block;width:100%;height:auto;touch-action:none;border:2px dashed #b6c4d8;border-radius:12px;background:white;margin:12px 0}.score{font-weight:700;color:#4338ca}.tip{background:#eef7ff;border-radius:12px;padding:12px;margin:12px 0}button:focus-visible{outline:3px solid #ff9f43}</style></head><body><div class="wrap"><header><h1>🐉 Vincent's Greek Adventure!</h1><div>Play, speak Greek, and draw! • Παίζουμε και μαθαίνουμε ελληνικά!</div></header><nav class="nav" id="nav"></nav><main class="panel" id="app"></main></div><script>
const sections=[
{icon:'🐉',name:'Who does it?',el:'Ποιος το κάνει;',help:'Choose the correct Greek word. / Διάλεξε τη σωστή ελληνική λέξη.',questions:[
['I play with the dragon.','Εγώ ___ με τον δράκο.',['παίζω','παίζει','παίζουμε'],0],['The witch plays with the cat.','Η μάγισσα ___ με τη γάτα.',['παίζουμε','παίζει','παίζω'],1],['We eat chocolate.','Εμείς ___ σοκολάτα.',['τρώμε','τρώει','τρώω'],0],['You (one person) are flying!','Εσύ ___!',['πετάνε','πετάς','πετάω'],1],['The dragons are sleeping.','Οι δράκοι ___.',['κοιμάται','κοιμούνται','κοιμάμαι'],1],['You and the dragon are dancing.','Εσείς ___!',['χορεύετε','χορεύει','χορεύουμε'],0],['I want a magical broom.','Εγώ ___ μια μαγική σκούπα.',['θέλει','θέλουμε','θέλω'],2]]},
{icon:'🧙',name:'Fix the witch',el:'Διόρθωσε τη μάγισσα',help:'The witch made a mistake. Choose the correct Greek sentence. / Διάλεξε τη σωστή πρόταση.',questions:[
['The witch is flying.','Which sentence is correct?',['Η μάγισσα πετάω.','Η μάγισσα πετάει.','Η μάγισσα πετάμε.'],1],['I see the dragon.','Which sentence is correct?',['Βλέπω τον δράκο.','Βλέπω ο δράκος.','Βλέπω η δράκος.'],0],['The dirty witch is cooking.','Which sentence is correct?',['Ο βρώμικος μάγισσα μαγειρεύει.','Η βρώμικο μάγισσα μαγειρεύει.','Η βρώμικη μάγισσα μαγειρεύει.'],2],['The cat drinks milk.','Which sentence is correct?',['Η γάτα πίνει γάλα.','Η γάτα πίνω γάλα.','Η γάτα πίνουμε γάλα.'],0],['We are in the kitchen.','Which sentence is correct?',['Εμείς είμαι στην κουζίνα.','Εμείς είμαστε στην κουζίνα.','Εμείς είναι στην κουζίνα.'],1],['I like the dragon.','Which sentence is correct?',['Μου αρέσει ο δράκος.','Με αρέσει ο δράκος.','Μου αρέσω ο δράκος.'],0]]},
{icon:'⏰',name:'Time machine',el:'Η μηχανή του χρόνου',help:'Yesterday, today, or tomorrow? Choose the correct Greek sentence. / Διάλεξε τη σωστή πρόταση.',questions:[
['Yesterday I ate pizza.','Χθες ___ πίτσα.',['τρώω','έφαγα','θα φάω'],1],['Tomorrow I will play.','Αύριο ___.',['έπαιξα','παίζω','θα παίξω'],2],['Today the dragon sleeps.','Σήμερα ο δράκος ___.',['κοιμάται','κοιμήθηκε','θα κοιμηθεί'],0],['Yesterday the witch went to school.','Χθες η μάγισσα ___ στο σχολείο.',['πηγαίνει','πήγε','θα πάει'],1],['Tomorrow we will dance.','Αύριο εμείς ___.',['χορέψαμε','χορεύουμε','θα χορέψουμε'],2],['Yesterday I woke up early.','Χθες ___ νωρίς.',['ξύπνησα','ξυπνάω','θα ξυπνήσω'],0]]},
{icon:'🔎',name:'Dragon mystery',el:'Το μυστήριο του δράκου',help:'Read the short Greek story. English help is available. / Διάβασε την ιστορία και απάντησε.',story:'Ο δράκος ξύπνησε στις οχτώ. Ήθελε να φάει πρωινό, αλλά το πιάτο του ήταν άδειο. Η γάτα είχε σοκολάτα στο στόμα της. Ο δράκος γέλασε, γιατί κατάλαβε ποιος έφαγε το πρωινό του.',translation:'The dragon woke up at eight. He wanted breakfast, but his plate was empty. The cat had chocolate around its mouth. The dragon laughed because he understood who ate his breakfast.',questions:[
['What time did the dragon wake up?','Τι ώρα ξύπνησε ο δράκος;',['Στις έξι.','Στις οχτώ.','Στις δέκα.'],1],['What was empty?','Τι ήταν άδειο;',['Το πιάτο.','Το μπουκάλι.','Το δωμάτιο.'],0],['Who probably ate the breakfast?','Ποιος μάλλον έφαγε το πρωινό;',['Η μάγισσα.','Ο δράκος.','Η γάτα.'],2],['Why did the dragon laugh?','Γιατί γέλασε ο δράκος;',['Γιατί κατάλαβε τι έγινε.','Γιατί φοβήθηκε.','Γιατί κοιμήθηκε.'],0],['What did the dragon want?','Τι ήθελε ο δράκος;',['Να πετάξει.','Να φάει πρωινό.','Να ζωγραφίσει.'],1]]},
{icon:'🎭',name:'Talk & choose',el:'Μίλα και διάλεξε',help:'Choose an answer, then say your own sentence out loud. / Πες και μια δική σου πρόταση.',questions:[
['I want to fly because...','Θέλω να πετάξω γιατί...',['έχω φτερά.','είμαι ένα πιάτο.','κοιμάται η πέτρα.'],0],['The witch is scared because...','Η μάγισσα φοβάται γιατί...',['η γάτα είναι τρομακτική.','πίνουμε χυμό.','εγώ ξυπνάω.'],0],['If I had a dragon, I would...','Αν είχα έναν δράκο, θα...',['πετούσα μαζί του.','πετάει μαζί του.','πετάμε μαζί του.'],0],['The cat is hungry, so...','Η γάτα πεινάει, γι’ αυτό...',['θέλει να φάει.','θέλω να φάω.','θέλουμε να φάμε.'],0],['We are happy because...','Είμαστε χαρούμενοι γιατί...',['παίζουμε μαζί.','παίζει μαζί.','παίζω μαζί.'],0]]}
];
let tab=0,index=0,selected=null,score=0,showEnglish=false;const app=document.getElementById('app'),nav=document.getElementById('nav');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')};function renderNav(){nav.innerHTML=sections.map((s,i)=>`<button class="${tab===i?'active':''}" onclick="switchTab(${i})">${s.icon} ${s.name}</button>`).join('')+`<button class="${tab===5?'active':''}" onclick="switchTab(5)">🎨 Drawing</button>`};function switchTab(t){tab=t;index=0;score=0;selected=null;showEnglish=false;renderNav();render()}
function render(){if(tab===5){drawing();return}let s=sections[tab],q=s.questions[index];if(!q){app.innerHTML=`<h2>🎉 Μπράβο, Vincent!</h2><p>You finished this adventure! / Τελείωσες αυτή την περιπέτεια!</p><p class="score">${score} / ${s.questions.length}</p><p>Now tell your teacher one funny Greek sentence! / Πες μία αστεία πρόταση στα ελληνικά!</p><button class="btn next" onclick="switchTab(${tab})">Play again / Παίξε ξανά</button>`;return}app.innerHTML=`<div class="small">${s.icon} ${s.name} · ${index+1}/${s.questions.length}</div><h2>${s.el}</h2><p class="en">${s.help}</p>${s.story?`<div class="prompt"><strong>📖 ${esc(s.story)}</strong><div style="margin-top:8px"><button class="btn" onclick="showEnglish=!showEnglish;render()">${showEnglish?'Hide English':'Show English help'}</button>${showEnglish?`<p class="en">${esc(s.translation)}</p>`:''}</div></div>`:''}<div class="en">${esc(q[0])}</div><div class="gr">${esc(q[1])}</div><div class="options">${q[2].map((v,i)=>`<button class="choice ${selected!==null?(i===q[3]?'correct':i===selected?'wrong':''):''}" ${selected!==null?'disabled':''} onclick="answer(${i})">${esc(v)}</button>`).join('')}</div><div class="feedback">${selected===null?'':selected===q[3]?'🌟 Μπράβο! Great job!':'💡 Good try! / Καλή προσπάθεια!'}${selected!==null?`<div class="small">Correct: ${esc(q[2][q[3]])}</div>`:''}</div>${selected!==null?`<button class="btn next" onclick="next()">Next / Επόμενο ➜</button>`:''}<p class="small">✨ After every few questions, make your own silly sentence in Greek!</p>`}
function answer(i){if(selected!==null)return;selected=i;if(i===sections[tab].questions[index][3])score++;render()}function next(){index++;selected=null;render()}
let ctx,canvas,painting=false,last=null,color='#6d42ce',width=7,history=[];const prompts=[['Draw a dragon eating a giant pizza.','Ζωγράφισε έναν δράκο που τρώει μια τεράστια πίτσα.'],['Draw a witch flying over the ocean.','Ζωγράφισε μια μάγισσα που πετάει πάνω από τον ωκεανό.'],['Draw a magical bed that can fly.','Ζωγράφισε ένα μαγικό κρεβάτι που μπορεί να πετάξει.'],['Draw yourself and the dragon playing together.','Ζωγράφισε εσένα και τον δράκο να παίζετε μαζί.'],['Draw a cat cooking something very strange.','Ζωγράφισε μια γάτα που μαγειρεύει κάτι πολύ παράξενο.']];let p=0;
function drawing(){app.innerHTML=`<h2>🎨 Magic Drawing / Μαγική ζωγραφική</h2><p class="en">Draw, then tell your teacher what is happening in Greek. / Ζωγράφισε και μετά πες τι γίνεται στα ελληνικά.</p><div class="prompt"><strong id="drawprompt">${prompts[p][0]}</strong><p id="greekprompt" class="gr" style="font-size:1.15rem;margin:8px 0">${prompts[p][1]}</p><button class="btn" onclick="p=(p+1)%prompts.length;document.getElementById('drawprompt').textContent=prompts[p][0];document.getElementById('greekprompt').textContent=prompts[p][1]">🎲 New idea / Νέα ιδέα</button></div><div class="toolbar" id="colors"></div><div class="toolbar"><label>Brush size <input id="brush" type="range" min="2" max="35" value="7" oninput="width=+this.value"></label><button onclick="color='#ffffff'">🧽 Eraser</button><button onclick="undo()">↶ Undo</button><button onclick="clearDrawing()">🗑️ Clear</button><button onclick="saveDrawing()">💾 Save PNG</button></div><canvas id="canvas" width="760" height="410"></canvas><div class="tip"><strong>Speak Greek! / Μίλα ελληνικά!</strong><p>Τι είναι αυτό; • Τι κάνει; • Πού είναι; • Γιατί; • Τι θα γίνει μετά;</p><p class="en">What is this? What is it doing? Where is it? Why? What happens next?</p></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);history=[];let palette=['#6d42ce','#ef4444','#f59e0b','#22c55e','#0ea5e9','#111827','#ec4899','#ffffff'];document.getElementById('colors').innerHTML=palette.map(c=>`<button class="color ${c===color?'selected':''}" style="background:${c}" aria-label="color ${c}" onclick="color='${c}';document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>`).join('');canvas.addEventListener('pointerdown',e=>{e.preventDefault();history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>15)history.shift();painting=true;last=coords(e);canvas.setPointerCapture(e.pointerId);dot(last)});canvas.addEventListener('pointermove',e=>{if(!painting)return;e.preventDefault();let v=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(v.x,v.y);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();last=v});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>painting=false))}
function coords(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function dot(v){ctx.beginPath();ctx.arc(v.x,v.y,width/2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function undo(){if(history.length)ctx.putImageData(history.pop(),0,0)}function clearDrawing(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height)}function saveDrawing(){let a=document.createElement('a');a.download='Vincent-Greek-Drawing.png';a.href=canvas.toDataURL('image/png');a.click()}
renderNav();render();</script></body></html>
